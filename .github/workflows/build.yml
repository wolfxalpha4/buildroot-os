name: Build Custom Buildroot OS

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Buildroot on GitHub Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Check out OS configuration repository
        uses: actions/checkout@v4

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ make file cpio unzip rsync \
            bc libncurses-dev libssl-dev git wget python3 \
            libelf-dev bison flex which

      - name: Download Buildroot Stable
        run: |
          git clone --depth 1 --branch 2024.02.10 https://gitlab.com/buildroot.org/buildroot.git buildroot-src

      - name: Cache Buildroot Downloads (tarballs)
        uses: actions/cache@v4
        with:
          path: buildroot-src/dl
          key: buildroot-dl-${{ hashFiles('configs/custom_os_defconfig') }}
          restore-keys: |
            buildroot-dl-

      - name: Prepare Configuration and Overlays
        run: |
          cp -r board/custom buildroot-src/board/
          cd buildroot-src
          # Merge official QEMU x86_64 base with our custom defconfig
          support/kconfig/merge_config.sh -m configs/qemu_x86_64_defconfig ../configs/custom_os_defconfig
          make olddefconfig

      - name: Compile OS Images
        run: |
          cd buildroot-src
          make -j$(nproc)

      - name: Compress and Prepare Output Artifacts
        run: |
          mkdir -p release-output
          cp buildroot-src/output/images/bzImage release-output/
          cp buildroot-src/output/images/rootfs.ext4 release-output/ || cp buildroot-src/output/images/rootfs.ext2 release-output/
          cd release-output
          gzip -9 -c bzImage > bzImage.gz
          ls -lh

      - name: Upload OS Images as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-buildroot-os
          path: |
            release-output/bzImage
            release-output/rootfs.*
          retention-days: 14

      - name: Create GitHub Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-output/bzImage
            release-output/rootfs.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
